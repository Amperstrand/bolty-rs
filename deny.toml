[advisories]
yanked = "deny"
ignore = [
    "RUSTSEC-2026-0190",  # anyhow unsound — no fix available, accepted risk
    "RUSTSEC-2026-0110",  # bare-metal unmaintained — embedded ecosystem standard
    "RUSTSEC-2026-0173",  # proc-macro-error2 unmaintained — transitive dep
    # webpki-roots 0.26.11 (bolty-cli -> ureq 2.12 only; no firmware): the
    # 0.26.x line has no fixed release (fix is the 1.x line, RUSTSEC-2026-0381).
    # The nested root store IS patched (webpki-roots 1.0.10 in this lockfile,
    # rustls-webpki 0.103.16); exposure is bolty-cli verifying our own
    # boltcardpoc edge, not a generic HTTPS client. Real fix = ureq 3 major
    # bump — tracked in docs/dependency-duplicates.md (defer, owner call).
    "RUSTSEC-2026-0381",
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "GPL-3.0-or-later",
    "GPL-2.0-or-later",  # pn7160-nci (ccid-firmware-rs, Amperstrand)
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/Amperstrand/ntag424.git",
    "https://github.com/Amperstrand/mfrc522-rs.git",
    "https://github.com/Foundation-Devices/iso14443-rs.git",  # upstream direct — the Amperstrand fork is retired (#105)
    "https://github.com/Amperstrand/ccid-firmware-rs.git",  # pn7160-nci (shared NCI core, rev-pinned)
    "https://github.com/Amperstrand/stm32f4xx-hal.git",  # F469 bring-up fork, rev-pinned (#128)
]
# Removed (issue #110): Amperstrand/esp-idf-svc.git — the fork was retired by
# #95 (apps/bolty-esp32 uses crates.io esp-idf-svc); no manifest references
# the git source remain. Re-add only alongside a future git re-pin.

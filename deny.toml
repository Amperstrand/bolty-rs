[advisories]
yanked = "deny"
ignore = [
    "RUSTSEC-2026-0190",  # anyhow unsound — no fix available, accepted risk
    "RUSTSEC-2026-0110",  # bare-metal unmaintained — embedded ecosystem standard
    "RUSTSEC-2026-0173",  # proc-macro-error2 unmaintained — transitive dep
    # (2026-10-24) RUSTSEC-2026-0387 ignore REMOVED: ntag424 re-pinned
    # (Amperstrand/ntag424#13, originality feature-gate) — p224 and
    # crypto-bigint left the dependency graph entirely; no P-224 code
    # ships in bolty builds. audit.yml's mirror flag removed together.
    # (2026-10-21) RUSTSEC-2026-0381 ignore REMOVED: bolty-cli migrated to
    # ureq 3 (rustls TLS, webpki-roots 1.x) — webpki-roots 0.26.x is out of
    # the graph (was the 0.26.11 facade over an already-patched 1.0.10).
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "GPL-3.0-or-later",
    "GPL-2.0-or-later",  # pn7160-nci (ccid-firmware-rs, Amperstrand)
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/Amperstrand/ntag424.git",
    "https://github.com/Amperstrand/mfrc522-rs.git",
    # Kernel M2 (t_e3335b39): the Amperstrand fork is the canonical iso14443
    # source again — its ai-experiments tip carries the in-trait WTX hook
    # (`PcdTransceiver::try_set_timeout_ms`) that ccid's mfrc522-pcd rides;
    # bolty must resolve the same crate instance or the traits split.
    # Upstream direct (Foundation-Devices) entry retired with the flip: no
    # manifest references it remain. Re-add only alongside a future re-pin.
    "https://github.com/Amperstrand/iso14443-rs.git",
    # pn7160-nci (shared NCI core) + mfrc522-pcd (kernel M2 canonical home)
    # + boards (boards-as-data), all rev-pinned
    "https://github.com/Amperstrand/ccid-firmware-rs.git",
    "https://github.com/Amperstrand/stm32f4xx-hal.git",  # F469 bring-up fork, rev-pinned (#128)
]
# Removed (issue #110): Amperstrand/esp-idf-svc.git — the fork was retired by
# #95 (apps/bolty-esp32 uses crates.io esp-idf-svc); no manifest references
# the git source remain. Re-add only alongside a future git re-pin.

[package]
name = "bolty-esp32"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Bolty NFC bolt card firmware for ESP32 + MFRC522"

[[bin]]
name = "bolty-esp32"
path = "src/main.rs"

[features]
default = []
nfc-mfrc522 = []
nfc-pn7160 = ["dep:bolty-pn7160", "bolty-pn7160/esp"]
led-matrix = []
display-st7789 = ["dep:mipidsi", "dep:embedded-graphics"]
board-m5atom = ["nfc-mfrc522", "led-matrix"]
board-m5stick = ["nfc-mfrc522", "display-st7789"]
# ESP32-C3 nucula board (issue #115): PN7160 NCI reader frontend over
# bolty-pn7160. Slim console-only build — no wifi/rest/ota/ble/display.
board-nucula = ["nfc-pn7160"]
wifi = []
rest = ["wifi"]
ota = ["wifi", "dep:ed25519-dalek"]
# OTA seat server (:3232, ccid wire protocol) — bench recovery door for
# board-nucula: keeps OTA pushes bidirectional after bolty is flashed
# (issue #115). Requires wifi.
ota-server = ["wifi"]
# BLE is opt-in — has NO authentication by default. See issue #34.
# Enable with: --features "board-m5stick,ble"
ble = []

[dependencies]
bolty-core = { path = "../../crates/bolty-core" }
bolty-ntag = { path = "../../crates/bolty-ntag" }
bolty-pn7160 = { path = "../../crates/bolty-pn7160", optional = true }
mfrc522-pcd = { path = "../../crates/mfrc522-pcd" }
bolty-mfrc522 = { path = "../../crates/bolty-mfrc522" }
embedded-hal = "=1.0.0"
embedded-svc = "=0.29.0"
heapless = { version = "=0.9.2", default-features = false }
ntag424 = { workspace = true }
iso14443 = { workspace = true }
log = "=0.4.29"
mipidsi = { version = "=0.9.0", optional = true }
embedded-graphics = { version = "=0.8.2", optional = true }
enumset = "=1.1.10"
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["alloc"], optional = true }

# ESP32 targets: classic ESP32 (m5 boards) is xtensa, the nucula's
# ESP32-C3 (board-nucula, issue #115) is riscv32 — same dep generation
# for both (matches ccid-firmware-rs and pn7160-nci's own gate).
[target.'cfg(any(target_arch = "xtensa", target_arch = "riscv32"))'.dependencies]
esp-idf-sys = { version = "0.38", features = ["binstart"] }
esp-idf-hal = "0.47"
esp-idf-svc = "0.53"
# boards-as-data (ccid-firmware-rs boards-as-data design §3.4, ccid PR
# #418): the m5 Grove map + NFC I2C address live in ccid's
# crates/boards — bolty B2 (docs/lessons-learned.md) stays as the
# provenance CITATION, not as local pin data. Rev-pinned git dep, the
# pn7160-nci precedent; pure no_std const data, no HAL deps.
boards = { git = "https://github.com/Amperstrand/ccid-firmware-rs.git", rev = "354cc118ea7be78a4900a2485a6fed5551e36a96" }

[build-dependencies]
# 0.32 cannot parse ESP-IDF v5.5.5's tools.json (new win-arm64 platform
# variant → serde panic) and coexists with esp-idf-sys's own 0.33 copy in
# the lock — unify on 0.33.
embuild = { version = "=0.33.5", features = ["espidf"] }

[lints]
workspace = true

# Pinned so the IDF version no longer rides embuild defaults (Amperstrand
# unification, 2026-10-12). Same mechanism as ccid-firmware-rs.
[package.metadata.esp-idf-sys]
esp_idf_version = "tag:v5.5.5"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.8.2" }


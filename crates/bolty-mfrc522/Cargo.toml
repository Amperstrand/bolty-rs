[package]
name = "bolty-mfrc522"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "MFRC522 NFC transport for ntag424"

[dependencies]
mfrc522-pcd = { path = "../mfrc522-pcd" }
ntag424 = { workspace = true }
# No unconditional "std": upstream iso14443 gates Fwi::fwt() (Duration)
# behind its std feature and the crate is no_std-capable without it. This
# crate's own `std` feature (default) keeps the host path identical.
iso14443 = { workspace = true }
iso14443-session = { path = "../iso14443-session" }
mfrc522 = { workspace = true }
embedded-hal = "=1.0.0"
log = "=0.4.29"

[features]
default = ["std"]
std = ["iso14443/std"]

[dev-dependencies]
iso14443 = { workspace = true, features = ["std"] }

[lints]
workspace = true

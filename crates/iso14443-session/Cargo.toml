[package]
name = "iso14443-session"
version = "0.1.0"
edition = "2021"
description = "Borrow-free ISO 14443-4 PCD session over the public upstream iso14443 API: caller-owned transceiver, S(WTX) timeout extension, Rule-5-correct chain recovery"
license = "GPL-3.0-or-later"

[dependencies]
# Workspace pin (byte-identical to ccid's crates/mfrc522-pcd iso14443 pin —
# see root Cargo.toml): one crate instance across bolty + the mfrc522-pcd
# git dep, so the PcdTransceiver traits unify.
iso14443 = { workspace = true }

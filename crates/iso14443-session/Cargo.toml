[package]
name = "iso14443-session"
version = "0.1.0"
edition = "2021"
description = "Borrow-free ISO 14443-4 PCD session over the public upstream iso14443 API: caller-owned transceiver, S(WTX) timeout extension, Rule-5-correct chain recovery"
license = "GPL-3.0-or-later"

[dependencies]
iso14443 = { git = "https://github.com/Foundation-Devices/iso14443-rs.git", rev = "216d1b919ca1fd4d30048a1c764f14379137f3c7", features = ["alloc"] }

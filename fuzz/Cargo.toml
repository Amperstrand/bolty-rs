[package]
name = "bolty-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Host-side fuzz targets (#86 phase 1: parser/auth pure functions — the
# differential-vs-ACR1252U leg is queued behind the rig lane's reader
# ownership). Runs on the nightly exception documented in rust-toolchain.toml.
# NOT part of the main workspace (empty workspace table detaches it) so
# `cargo test --workspace` never builds libfuzzer on stable.

[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
bolty-core = { path = "../crates/bolty-core" }
bolty-ntag = { path = "../crates/bolty-ntag" }
# Canonical upstream directly — the Amperstrand fork is retired (the
# fork-vs-upstream differential found its fix and closed itself out).
iso14443 = { git = "https://github.com/Foundation-Devices/iso14443-rs.git", rev = "216d1b919ca1fd4d30048a1c764f14379137f3c7", package = "iso14443", features = ["alloc"] }

[[bin]]
name = "picc_parse_url"
path = "fuzz_targets/picc_parse_url.rs"
test = false
doc = false
bench = false

[[bin]]
name = "picc_decrypt_p"
path = "fuzz_targets/picc_decrypt_p.rs"
test = false
doc = false
bench = false

[[bin]]
name = "picc_verify_c"
path = "fuzz_targets/picc_verify_c.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_ndef_uri"
path = "fuzz_targets/parse_ndef_uri.rs"
test = false
doc = false
bench = false

[[bin]]
name = "standardize_url_template"
path = "fuzz_targets/standardize_url_template.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_picc_url"
path = "fuzz_targets/picc_url.rs"
test = false
doc = false
bench = false

[[bin]]
name = "iso14443_ats"
path = "fuzz_targets/iso14443_ats.rs"
test = false
doc = false
bench = false


# Expected-card registry — the HIL safety contract.
# Any card NOT listed here (or listed without the required op) is REFUSED
# for that operation. UID is lowercase (console/pcsc normalization).
#
# ops: read        = read-only commands (uid/url/inspect/picc/diagnose)
#      burn        = may be burned (deterministic issuers only)
#      wipe        = may be wiped
# state: expected state before a burn-cycle run (asserted in preflight)

[cards.04c474fa967380]
alias        = "stick-antenna"
reader_hint  = "GemPCTwin"           # only reachable through the stick MFRC522
ops          = ["read", "burn", "wipe"]
state        = "any"                  # provisioned|blank|any (overnight end-states vary)

[cards.04455ffa967380]
alias        = "acr-lab-blank"
reader_hint  = "ACR1252"
ops          = ["read", "burn", "wipe"]
state        = "any"

# Recovery-case card, RECOVERED 2026-10-19: M5StickC static-key burn
# confirmed via try-key (K0=0x11*16), wiped to factory with
# `wipe --raw-keys` (+ try-key-proven --skip-preverify); factory K0
# accepted post-wipe. Returned to burn service per the recovery plan
# (AGENTS "Card Recovery" Step 3).
[cards.043365fa967380]
alias        = "recovered-static-key"
reader_hint  = "any"
ops          = ["read", "burn", "wipe"]
state        = "any"

# Foreign-project cards (J3R180/JCOP — ccid-firmware-rs j3r180 lane,
# 2026-10-21): expected on shared readers for THEIR project. Registered
# read-only so preflight names them instead of 'not burn-allowed mystery';
# bolt lanes never mutate them. Identified by: ISO14443-4, no DESFire/
# NTAG native layer (0x90 CLA -> 6E00), no PPSE (6A82).
[cards.0447838aae1790]
alias        = "j3r180-acr-slot"
reader_hint  = "ACR1252"
ops          = ["read"]

[cards.044b858aae1790]
alias        = "j3r180-stick-slot"
reader_hint  = "GemPCTwin"
ops          = ["read"]

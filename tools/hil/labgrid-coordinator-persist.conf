# systemd drop-in: /etc/systemd/system/labgrid-coordinator.service.d/persist.conf
#
# labgrid's coordinator persists places.yaml/resources.yaml into its CWD
# (atomic_replace, relative paths; 15s save poll). The service had no
# WorkingDirectory (= /), where User=ubuntu cannot write — persistence
# silently never happened and every restart wiped the places (#82).
# Install with:
#   sudo mkdir -p /etc/systemd/system/labgrid-coordinator.service.d
#   sudo cp this.conf /etc/systemd/system/labgrid-coordinator.service.d/persist.conf
#   sudo mkdir -p /var/lib/labgrid && sudo chown ubuntu:ubuntu /var/lib/labgrid
#   sudo systemctl daemon-reload && sudo systemctl restart labgrid-coordinator
[Service]
WorkingDirectory=/var/lib/labgrid

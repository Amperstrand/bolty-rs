# greatspectations spec-quote drift config for bolty-rs
#
# Tool: Amperstrand fork https://github.com/Amperstrand/greatspectations
#       (branch ai-experimental-slop, issue #69; pinned in the workflow)
# Specs: https://github.com/boltcard/boltcard (docs/ — markdown), pinned
#       in .github/workflows/spec-quote-drift.yml (conformance-audit.md
#       §1: quote-lock sources are PINNED, never floating-HEAD; bumping the
#       pin is a deliberate reviewed change that re-verifies every quote)
#
# Comment marker syntax in Rust source:
#   // BOLT_SPEC: <verbatim quote from spec/docs/SPEC.md>
#   // BOLT_DET:  <verbatim quote from spec/docs/DETERMINISTIC.md>
#   // BOLT_PRIV: <verbatim quote from spec/docs/CARD_PRIVACY.md>
#
# Trap (AGENTS.md "Spec Conformance"): consecutive `//` lines join into ONE
# multi-line quote matched against contiguous spec text — separate quotes
# from prose with a blank line. Quotes are verbatim incl. backticks and
# upstream typos ("specfying" in CARD_PRIVACY:26 is pinned deliberately).
#
# Setup (one-time, local):
#   git clone --depth=1 https://github.com/boltcard/boltcard.git spec
#   uv venv .gs-env && uv pip install --python .gs-env/bin/python \
#       git+https://github.com/Amperstrand/greatspectations.git@ai-experimental-slop
#
# Run (from repo root):
#   .gs-env/bin/python -m greatspectations check --config specquotes.toml \
#       --comment-start '// ' --comment-continue '//' -k -v \
#       crates/bolty-core/src crates/bolty-ntag/src apps/bolty-cli/src
#
# NXP-layer facts (NTAG424 datasheet, AN12196) are NOT covered here: they are
# proprietary PDFs with no canonical text source. Coverage for that layer
# comes from byte-exact fixture vectors, not quotes.

[sources.BOLT_SPEC]
format = "markdown"
file = "spec/docs/SPEC.md"
comment_marker = "BOLT_SPEC"

# MUST-level lines bolty implements — coverage reports *** if any goes unquoted.
normative = ["35", "36", "39"]  # p decrypt, c CMAC verify, increasing counter

[sources.BOLT_DET]
format = "markdown"
file = "spec/docs/DETERMINISTIC.md"
comment_marker = "BOLT_DET"

normative = [
  "5", "6", "7", "8",        # key roles (K0..K4)
  "24", "25", "26", "27", "28", "29", "30",  # PRF derivation formulas
  "33", "34", "35",          # IssuerKey/UID/Version parameter contracts (35: version must increment)
  "37",                      # PRF = CMAC (NIST SP 800-38B)
  "41",                      # blank-check before setup (burn preflight)
  "57", "58", "59",          # reset pre-verification gate (wipe gate, DET:57-59 in test_burn_lock_wipe.py)
]

[sources.BOLT_PRIV]
format = "markdown"
file = "spec/docs/CARD_PRIVACY.md"
comment_marker = "BOLT_PRIV"

normative = ["9", "10", "11", "12", "26", "27", "28", "33", "41", "42", "43"]  # three-part URI + table rows + max-privacy statement + privacy-level table

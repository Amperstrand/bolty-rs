---
# Workflow: real STM32 firmware build (bare-metal thumbv7em).
#
# Same reason esp32-check.yml exists: before this lane NOTHING compiled
# apps/bolty-stm32 for its ARM target — host lanes only ever built the
# host-stub configuration. Main was in fact already target-broken when
# this lane was wired (std leaked into the no_std graph through manifest
# defaults; fixed in the accompanying no_std commit, issue #111). A
# release build (not `cargo check`) so link errors surface too.
#
# NOT covered here, on purpose: any QEMU/HIL execution, flashing, or
# hardware bring-up — apps/bolty-stm32 is a skeleton (hardware init
# pending, ROADMAP); this lane guards build rot only.
name: stm32-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stm32-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Same pattern as host-ci.yml: the action needs an explicit channel
      # (empty input red-ran on 2026-10-16); rust-toolchain.toml stays the
      # single authority.
      - name: Read pinned toolchain from rust-toolchain.toml
        id: toolchain
        run: echo "channel=$(grep -oP '(?<=^channel = \")[^\"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: thumbv7em-none-eabihf
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Host clippy excludes firmware crates (dead-code by design on host);
      # for the real target the full crate compiles, so it lints here.
      - name: Clippy (target, board-stm32f4-disco + nfc-mfrc522)
        run: >
          cargo clippy -p bolty-stm32 --target thumbv7em-none-eabihf
          --features board-stm32f4-disco,nfc-mfrc522 -- -D warnings
      - name: Build firmware (release — link errors surface)
        run: >
          cargo build --release -p bolty-stm32 --target thumbv7em-none-eabihf
          --features board-stm32f4-disco,nfc-mfrc522

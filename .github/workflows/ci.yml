name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: CI (fmt + clippy + host tests)
    uses: Amperstrand/amp-embedded-common/.github/workflows/rust-embedded.yml@fb14e7817c46e4f7051cdedd5e7dc1022224c47f
    with:
      # Host clippy must exclude the firmware crate (dead-code by design on host)
      clippy-flags: "--workspace --exclude bolty-esp32"
      toolchain: "stable"
      apt-packages: "libpcsclite-dev"
      test-flags: "--workspace --exclude bolty-esp32"
      # clippy-target is empty (default) → host clippy only

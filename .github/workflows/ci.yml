name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: CI (fmt + clippy + host tests)
    uses: Amperstrand/amp-embedded-common/.github/workflows/rust-embedded.yml@main
    with:
      toolchain: "stable"
      apt-packages: "libpcsclite-dev"
      test-flags: "--workspace --exclude bolty-esp32"
      # clippy-target is empty (default) → host clippy only

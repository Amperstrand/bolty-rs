---
# Workflow: real ESP32 firmware build.
#
# This REPLACED a stub that only echoed `cargo +esp check -p bolty-esp32
# --target xtensa-esp32-espidf` — commands that do not even work as written
# (workspace-root invocation misses apps/bolty-esp32/.cargo/config.toml;
# see AGENTS.md "ESP32 Build Commands"). The REST job API merged with four
# compile errors because nothing anywhere built the firmware target.
#
# Release builds (not `cargo check`) so link errors surface too.

name: esp32-check

on:
  push:
    branches: [main]
  pull_request:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # espup queries the GitHub API

jobs:
  esp32-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # esp-rs/xtensa-toolchain@v1.5 was replaced by pinned-espup provision
      # (ccid-firmware-rs CI pattern): the action's `version` input only pins
      # the Rust toolchain (espup --toolchain-version) — it cannot pin the
      # crosstool GCC and installs the LATEST. A new crosstool release can
      # fail the pinned IDF's tool_version_check at cmake configure time (the
      # esp-16.2.0_20260914 release broke ccid-firmware-rs CI on 2026-10-09
      # that way). The pin must match the full crosstool-NG build string the
      # pinned ESP-IDF demands — v5.5.5 accepts esp-14.2.0_20260121 and
      # rejects the 20241119 build of the same GCC 14.2.0.
      - name: Install espup + ldproxy
        # ldproxy is the xtensa-espidf linker (.cargo/config.toml selects
        # it) — espup does NOT install it; the old xtensa-toolchain action
        # provided it via its `ldproxy: true` input, which this pinned-espup
        # provision replaced (CI failed: "linker `ldproxy` not found").
        run: cargo install espup ldproxy
      - name: Install ESP toolchain (xtensa, pinned crosstool)
        run: |
          espup install -c 14.2.0_20260121
          . ${HOME}/export-esp.sh
      - name: Build firmware (board-m5stick, wifi+rest+ota)
        run: |
          . ${HOME}/export-esp.sh
          cd apps/bolty-esp32
          cargo +esp build --release --features "board-m5stick,wifi,rest,ota"
      - name: Build firmware (board-m5atom)
        run: |
          . ${HOME}/export-esp.sh
          cd apps/bolty-esp32
          cargo +esp build --release --features "board-m5atom"
      # The `board-m5stick,ble` config is deliberately absent: enabling
      # Bluedroid compiles the esp-idf-svc 0.52.x fork's bt module, which is
      # blocked on the esp-idf-rs generation, not on the IDF pin (v5.5.5 now
      # ships the >= 5.3 symbols). esp-idf-svc 0.53.0 is released but requires
      # esp-idf-hal ^0.47 + esp-idf-sys ^0.38 — a full generation bump
      # (links conflict with the pinned hal 0.46.2 / sys 0.37.2), not a
      # svc-only bump. Unblock with that generation bump, then uncomment the
      # BT block in apps/bolty-esp32/sdkconfig.defaults.

  # Firmware unit tests (issue #63): the pure-logic modules (commands,
  # service, workflow) have no esp-idf deps and compile on host, so their
  # #[cfg(test)] suites run here. Before this job they executed nowhere —
  # no xtensa test runner is wired and the host build was broken.
  firmware-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run firmware unit tests (host)
        run: cargo test -p bolty-esp32

  # Host-side spec-quote drift check lives in spec-quote-drift.yml.

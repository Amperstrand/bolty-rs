---
# Workflow: greatspectations spec-quote drift detection for bolty-rs.
#
# Verifies that `// BOLT_SPEC:` / `// BOLT_DET:` / `// BOLT_PRIV:` quotes in
# crates/ match the boltcard spec (boltcard/boltcard docs/) verbatim, so
# comments claiming spec behavior cannot silently drift from the spec.
#
# Tool: Amperstrand fork (issue #69), pinned by commit — the fork's
# ai-experimental-slop branch moves; a quote red-run must mean quote drift,
# never tool drift. Spec source pinned the same way (conformance-audit.md
# §1 quote-lock rule): the weekly cron catches LOCAL drift against the
# pinned bytes; UPSTREAM spec changes surface as a deliberate pin-bump
# review that re-verifies every quote.
#
# NXP-layer facts (NTAG424 datasheet, AN12196) are intentionally not covered:
# proprietary PDFs have no canonical text source; that layer is guarded by
# byte-exact fixture vectors instead.

name: spec-quote-drift

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: local drift against the pinned spec bytes

env:
  # boltcard/boltcard docs @ 2026-08-19 (last upstream docs commit)
  SPEC_PIN: b8f11ecd63ce884eeaf0185d8ce1846960b64b5f
  # Amperstrand/greatspectations @ ai-experimental-slop (issue #69 fork)
  GS_TOOL_PIN: 272c171

jobs:
  spec-quote-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install greatspectations (pinned fork)
        run: pip install git+https://github.com/Amperstrand/greatspectations.git@${{ env.GS_TOOL_PIN }}
      - name: Clone boltcard spec (pinned)
        run: |
          git clone --depth=1 https://github.com/boltcard/boltcard.git spec
          git -C spec fetch --depth=1 origin $SPEC_PIN
          git -C spec checkout $SPEC_PIN
      - name: Spec-quote check
        run: |
          python -m greatspectations check --config specquotes.toml \
            --comment-start '// ' --comment-continue '//' -k -v \
            --coverage .coverage \
            $(git ls-files 'crates/bolty-core/src/*.rs' 'crates/bolty-ntag/src/*.rs' 'apps/bolty-cli/src/*.rs')
      - name: Spec-quote coverage report
        run: |
          python -m greatspectations coverage --config specquotes.toml \
            --coverage .coverage

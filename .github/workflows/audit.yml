name: Security Audit
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same fix as host-ci.yml: the action needs an explicit channel
      # (empty input red-runs "'toolchain' is a required input").
      - name: Read pinned toolchain from rust-toolchain.toml
        id: toolchain
        run: echo "channel=$(grep -oP '(?<=^channel = ")[^"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: Install cargo-audit
        run: cargo install cargo-audit
      # RUSTSEC-2026-0381: webpki-roots 0.26.x has no fixed release (fix is
      # the ureq-3 migration, done 2026-10-21 — flag removable once the
      # lockfile rotation lands everywhere).
      # RUSTSEC-2026-0387 ignore REMOVED (2026-10-24): the ntag424 re-pin
      # (Amperstrand/ntag424#13) made originality verification an optional
      # feature — p224/crypto-bigint left bolty's dependency graph and
      # cargo audit runs clean without the flag.
      - run: cargo audit --ignore RUSTSEC-2026-0381

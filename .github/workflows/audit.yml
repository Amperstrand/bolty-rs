name: Security Audit
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"

env:
  CARGO_TERM_COLOR: always
  # #179: no workflow-level RUSTUP_TOOLCHAIN — rustup's documented env
  # precedence made `stable` win over the pinned install below, so
  # cargo install/audit/deny ran on the runner's mutable stable.

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same fix as host-ci.yml: the action needs an explicit channel
      # (empty input red-runs "'toolchain' is a required input").
      - name: Read pinned toolchain from rust-toolchain.toml
        id: toolchain
        run: echo "channel=$(grep -oP '(?<=^channel = ")[^"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: Install cargo-audit
        run: cargo install cargo-audit
      # (2026-10-24) RUSTSEC-2026-0387 ignore REMOVED: the ntag424 re-pin
      # (Amperstrand/ntag424#13) made originality verification an optional
      # feature — p224/crypto-bigint left bolty's dependency graph and
      # cargo audit runs clean without the flag.
      # (2026-11-14) RUSTSEC-2026-0381 ignore flag REMOVED: the ureq-3
      # lockfile rotation landed everywhere (webpki-roots 0.26.x is out of
      # the graph; the flag's own "removable once the rotation lands" note
      # came due). rustix 1.1.4 -> 1.1.6 (RUSTSEC-2026-0486) and anyhow
      # =1.0.102 -> =1.0.104 (RUSTSEC-2026-0190) were cleared by patch
      # bumps, so no --ignore flags remain.
      - run: cargo audit

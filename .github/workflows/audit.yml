name: Security Audit
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same fix as host-ci.yml: the action needs an explicit channel
      # (empty input red-runs "'toolchain' is a required input").
      - name: Read pinned toolchain from rust-toolchain.toml
        id: toolchain
        run: echo "channel=$(grep -oP '(?<=^channel = ")[^"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: Install cargo-audit
        run: cargo install cargo-audit
      # RUSTSEC-2026-0381: webpki-roots 0.26.x has no fixed release (fix is
      # the 1.x line); the nested store is patched in-lockfile (1.0.10 +
      # rustls-webpki 0.103.16), consumer is bolty-cli->ureq only. Mirrors
      # the documented deny.toml ignore; drop both when ureq moves to 3.x.
      # RUSTSEC-2026-0381: webpki-roots 0.26.x has no fixed release (fix is
      # the ureq-3 migration, done 2026-10-21 — flag removable once the
      # lockfile rotation lands everywhere).
      # RUSTSEC-2026-0387: crypto-bigint 0.5.5 constant-time — p224-only
      # path (ntag424 fork transitive), no secrets on P-224, no fixed
      # release yet. Same revisit condition as deny.toml.
      - run: cargo audit --ignore RUSTSEC-2026-0381 --ignore RUSTSEC-2026-0387

[workspace]
exclude = ["fuzz"]
resolver = "2"
members = [
    "crates/*",
    "apps/*",
    "tests/security",
]

[workspace.dependencies]
ntag424 = { git = "https://github.com/Amperstrand/ntag424.git", rev = "7927c40225d56ba9cc4e5a0a968104a112b12563", default-features = false, features = ["sdm", "key-diversification", "alloc"] }
mfrc522 = { git = "https://github.com/Amperstrand/mfrc522-rs.git", rev = "e9ced1e" }
# iso14443: the Amperstrand fork's rebased ai-experiments tip (kernel M2,
# t_e3335b39). mfrc522-pcd now arrives from ccid-firmware-rs as a rev-pinned
# git dep and its `PcdTransceiver` impl rides the fork's in-trait
# `try_set_timeout_ms` WTX hook — bolty must resolve the SAME crate instance
# or the traits split into two graphs and stop unifying. The fork tip
# descends from upstream 216d1b9 (bolty's prior direct pin) + additive
# experiments, so the public API is a superset. The rev string MUST stay
# byte-identical to ccid's crates/mfrc522-pcd pin ("0f7d9d70"): a differing
# string (even short-vs-full of the same commit) splits the graph into two
# iso14443 copies (bench lesson 2026-10-21, ccid crates/mfrc522-pcd).
# Rev-pinned per fork-policy §2 rule 1 (rev-pinned builds must resolve to the
# same bytes forever). Bump procedure (§2 rule 2): explicit, reviewed commit
# that moves this rev AND the matching Cargo.lock entry.
iso14443 = { git = "https://github.com/Amperstrand/iso14443-rs.git", rev = "0f7d9d70", features = ["alloc"] }
# Kernel M2 (t_e3335b39): mfrc522-pcd's canonical home is ccid-firmware-rs
# (crates/mfrc522-pcd); bolty's duplicate local copy is deleted and every
# consumer (bolty-mfrc522, apps/bolty-esp32, apps/bolty-stm32) rides this
# rev-pinned git dep instead. Rev = ccid main at the flip
# (79456d9947f643bd58a6a8fc4c688ff5bdfe4bc3, post-#426 frontend
# constructors + FrontendDiagnostics). Bump = explicit reviewed commit
# moving this rev AND the Cargo.lock entry together (fork-policy §2 rule 2),
# keeping the rev byte-identical across every bolty manifest that pins it.
mfrc522-pcd = { git = "https://github.com/Amperstrand/ccid-firmware-rs.git", rev = "a0b1f7420fc82f186717e2f3a6029870372e1a15" }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
panic_in_result_fn = "warn"
indexing_slicing = "warn"
string_slice = "warn"

[profile.release]
# debug = 2: defmt 0.3.100 stores interned format strings in DWARF —
# without debug info probe-rs cannot decode RTT frames at all (silently
# shows nothing). Same setting ccid-firmware-rs uses. Flash image size is
# unaffected (DWARF is not loaded to the target).
debug = 2
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
# no `strip`: probe-rs locates the defmt-RTT control block via the ELF's
# _SEGGER_RTT symbol — stripping the symtab makes `probe-rs run` silently
# show no RTT output (found during the 2026-10-19 F469 bring-up; the flash
# image is unaffected — only host-side debug symbols are kept).

[patch."https://github.com/Amperstrand/ntag424.git"]
ntag424 = { path = "vendor/ntag424" }

[workspace]
exclude = ["fuzz"]
resolver = "2"
members = [
    "crates/*",
    "apps/*",
    "tests/security",
]

[workspace.dependencies]
ntag424 = { git = "https://github.com/Amperstrand/ntag424.git", rev = "02f23f51fc352f5abad8812550dc1e0361afe514", default-features = false, features = ["sdm", "key-diversification", "alloc"] }
mfrc522 = { git = "https://github.com/Amperstrand/mfrc522-rs.git", rev = "e9ced1e" }
# Canonical upstream directly — the Amperstrand fork is retired; our session
# API + WTX hook live consumer-side in crates/iso14443-session.
# Rev-pinned per fork-policy §2 rule 1 (rev-pinned builds must resolve to the
# same bytes forever; the unpinned entry from #105 let any `cargo update`
# float an MCU firmware dependency). Bump procedure (§2 rule 2): explicit,
# reviewed commit that moves this rev AND the matching Cargo.lock entry.
iso14443 = { git = "https://github.com/Foundation-Devices/iso14443-rs.git", rev = "216d1b919ca1fd4d30048a1c764f14379137f3c7", features = ["alloc"] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
panic_in_result_fn = "warn"
indexing_slicing = "warn"
string_slice = "warn"

[profile.release]
# debug = 2: defmt 0.3.100 stores interned format strings in DWARF —
# without debug info probe-rs cannot decode RTT frames at all (silently
# shows nothing). Same setting ccid-firmware-rs uses. Flash image size is
# unaffected (DWARF is not loaded to the target).
debug = 2
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
# no `strip`: probe-rs locates the defmt-RTT control block via the ELF's
# _SEGGER_RTT symbol — stripping the symtab makes `probe-rs run` silently
# show no RTT output (found during the 2026-10-19 F469 bring-up; the flash
# image is unaffected — only host-side debug symbols are kept).

[workspace]
exclude = ["fuzz"]
resolver = "2"
members = [
    "crates/*",
    "apps/*",
    "tests/security",
]

[workspace.dependencies]
ntag424 = { git = "https://github.com/Amperstrand/ntag424.git", rev = "afb7238516bcf5fac177eba1910565d1dde9354c", default-features = false, features = ["sdm", "key-diversification", "alloc"] }
mfrc522 = { git = "https://github.com/Amperstrand/mfrc522-rs.git", rev = "e9ced1e" }
# Canonical upstream directly — the Amperstrand fork is retired; our session
# API + WTX hook live consumer-side in crates/iso14443-session.
iso14443 = { git = "https://github.com/Foundation-Devices/iso14443-rs.git", features = ["alloc"] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
panic_in_result_fn = "warn"
indexing_slicing = "warn"
string_slice = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
